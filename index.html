<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kak!</title>
    <link rel="stylesheet" href="./src/style.css" />
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="./src/loadFile.js"></script>
    <script src="./src/showDownloadButton.js"></script>
    <script src="./src/downloadImage.js"></script>
  </head>
  <body>
    <div id="download-button">
      <a href="#" id="download-link" onclick="downloadImage(); return false;"
        >⬇</a
      >
    </div>
    <div class="frame-container">
      <div class="photo-container">
        <form action="">
          <div id="select-img-button">
            <label for="file-input">사진 선택하기</label>
          </div>
          <input
            type="file"
            id="file-input"
            accept="image/*"
            multiple
            onchange="loadFile(this)"
          />
        </form>
        <div class="photo-box" id="img1"></div>
        <div class="photo-box" id="img2"></div>
        <div class="photo-box" id="img3"></div>
        <div class="photo-box" id="img4"></div>
      </div>
      <div class="title-container">
        <img class="title-image" src="public/img/Kairos.png" />
      </div>
    </div>
  </body>
</html>
